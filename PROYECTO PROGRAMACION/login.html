<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Aleemnzz</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: white;">Aleemnzz</a>
    </nav>


    <div class="contenedor-login">
        <div class="tarjeta-login">
            <h2 style="color: #354eab; margin-top: 0; text-align: center;">Iniciar Sesión</h2>
            
            <form id="form-login">
                <div class="grupo-input">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresá tu usuario" required>
                </div>
                
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresá tu contraseña" required>
                </div>
                
                <button type="submit" class="btn-login-submit">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
